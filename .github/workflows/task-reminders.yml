name: Recordatorios frecuentes

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  run-reminders:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Llamar endpoint de recordatorios
        env:
          CRON_URL: ${{ secrets.CRON_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        if: env.CRON_URL != '' && env.CRON_SECRET != ''
        run: |
          curl -sfS -X POST "$CRON_URL" \
            -H "Authorization: Bearer $CRON_SECRET" \
            -H "Content-Type: application/json"
